name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard — no client PII under p/
        run: |
          tracked=$(git ls-files 'p/**' | grep -vE '^p/(\.gitkeep|README\.md)$' || true)
          if [ -n "$tracked" ]; then
            echo "Public ask must not track client folders under p/:"
            echo "$tracked"
            exit 1
          fi
      - run: node --test test/*.test.js
