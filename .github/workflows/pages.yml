name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write demo production overrides
        env:
          ASK_DEMO_WISE_URL: ${{ secrets.ASK_DEMO_WISE_URL }}
        run: |
          if [ -n "$ASK_DEMO_WISE_URL" ]; then
            cat > demo/config.local.js <<EOF
          Object.assign(window.PROPOSAL_CONFIG, {
            deposit: { url: "$ASK_DEMO_WISE_URL" }
          });
          EOF
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
